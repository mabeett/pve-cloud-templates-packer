## removes root user password and root login
#
---
- setup: gather_subset=!all,!any,min
  when: (ansible_facts['distribution'] is not defined) or (ansible_facts['distribution_release'] is not defined)

- include_tasks: "{{ nssh }}"
  with_first_found:
    - "ssh-non-root-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_release'] | lower }}.yml"
    - "ssh-non-root-{{ ansible_facts['distribution'] | lower }}-default.yml"
    - "ssh-non-root-default.yml"
  loop_control:
    loop_var: nssh

- name: remove root passwd
  ansible.builtin.user:
    name: root
    password: '!'
